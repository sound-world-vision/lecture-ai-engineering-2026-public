[project]
name = "aie2026-exercises"
version = "0.1.0"
description = "AIE2026 演習・宿題用リポジトリ（学習支援エージェントを育てる）"
readme = "README.md"
requires-python = ">=3.12, <3.14"  # 上限を追加
link-mode = "copy"
# 年度中に壊れないよう、バージョンは固定する
dependencies = [
    "accelerate==1.15.0",
    "datasets==5.1.0",
    "google-genai==2.31.0",
    "mlflow>=3.17.2",
    "peft==0.21.1",
    "pydantic-ai-slim[google,mcp]==2.57.0", # mcp は第5回（MCP サーバー・クライアント）で使う
    "python-dotenv>=1.2.4",
    "transformers==5.18.0",
    "trl==1.14.2",
    "torch==2.11.0+cu130",
    "torchvision",
    "torchaudio",
    "bitsandbytes==0.50.*",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
